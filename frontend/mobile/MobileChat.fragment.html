<sc-if value="{{isHome}}"><sc-scope value="{{homeChat}}"><section class="mobile-chat" aria-label="디미와 대화">
  <div class="scroll" ref="{{scrollRef}}">
    <sc-if value="{{showHome}}" hint-placeholder-val="{{ true }}">
      <section class="hero">
        <span class="glow"></span>
        <img src="/assets/home-chat-mascot.png" alt="디미">
        <h1>{{mobileGreeting}}<br>꺼내 드릴까요?</h1>
        <p>보낸 콘텐츠를 찾거나 편하게 물어보세요</p>
      </section>
      <div class="hs" style="margin-top:18px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="4"><button class="chip" onClick="{{q.pick}}"><span class="{{q.dot}}"></span>{{q.label}}</button></sc-for>
      </div>
      <div class="sech"><b>최근 보낸 콘텐츠</b><button class="textlink" onClick="{{goLibrary}}">전체 보기</button></div>
      <div class="hs">
        <sc-for list="{{recent}}" as="it" hint-placeholder-count="3">
          <button class="rc" onClick="{{it.open}}">
            <span class="th"><span class="orb {{it.orb}}" style="width:52px;height:52px"></span></span>
            <span class="bd"><span class="tag"><span class="{{it.dot}}"></span>{{it.typeLabel}}</span><span class="tt">{{it.title}}</span><span class="mt">{{it.when}}</span></span>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{hasNextSchedule}}"><div class="sech"><b>다가오는 일정</b><button class="textlink" onClick="{{goCalendar}}">캘린더</button></div>
      <sc-for list="{{nextSchedule}}" as="event"><button class="nx" onClick="{{event.open}}"><span class="cal"><span>{{event.mon}}</span><b>{{event.day}}</b></span><span class="schedule-copy"><b>{{event.title}}</b><span class="mt">{{event.what}} · {{event.badge}}</span></span></button></sc-for></sc-if>
      <sc-if value="{{recentNone}}"><div class="empty-note"><p>{{recentNotice}}</p><sc-if value="{{showNoticeAction}}"><button class="chip" onClick="{{noticeAction}}">{{noticeActionLabel}}</button></sc-if></div></sc-if>
      <div style="height:20px"></div>
    </sc-if>

    <sc-if value="{{showSug}}" hint-placeholder-val="{{ false }}">
      <div class="sugh"><span>{{sugLabel}}</span><span>{{sugCount}}</span></div>
      <sc-for list="{{sug}}" as="it" hint-placeholder-count="3">
        <button class="row" onClick="{{it.open}}">
          <span class="orb {{it.orb}}" style="width:40px;height:40px"></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span class="tt">{{it.title}}</span><span class="mt" style="display:flex;align-items:center;gap:6px"><span class="{{it.dot}}"></span>{{it.typeLabel}} · {{it.key}}</span></span>
        </button>
      </sc-for>
      <button class="askrow" onClick="{{askNow}}"><img src="/assets/home-chat-mascot.png" alt="" style="width:26px">디미에게 “{{query}}” 물어보기</button>
    </sc-if>

    <sc-if value="{{chatting}}" hint-placeholder-val="{{ false }}">
      <div class="thread" role="log" aria-label="디미와 대화" aria-live="polite">
        <sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
          <sc-if value="{{m.me}}" hint-placeholder-val="{{ true }}"><div class="me">{{m.text}}</div></sc-if>
          <sc-if value="{{m.bot}}" hint-placeholder-val="{{ false }}">
            <div class="bot">
              <span class="ava"><img src="/assets/home-chat-mascot.png" alt=""></span>
              <div class="bd">
                <sc-if value="{{m.typing}}" hint-placeholder-val="{{ false }}"><span class="typing" role="status" aria-label="디미가 입력 중"><i></i><i></i><i></i></span></sc-if>
                <sc-if value="{{m.ready}}" hint-placeholder-val="{{ true }}">
                  <p class="msg">{{m.text}}</p>
                  <sc-for list="{{m.results}}" as="it" hint-placeholder-count="2">
                    <button class="card" onClick="{{it.open}}">
                      <span class="orb {{it.orb}}" style="width:40px;height:40px"></span>
                      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span class="tt">{{it.title}}</span><span class="mt" style="display:flex;align-items:center;gap:6px"><span class="{{it.dot}}"></span>{{it.typeLabel}} · {{it.key}}</span></span>
                      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
                    </button>
                  </sc-for>
                  <div class="fchips"><sc-for list="{{m.follow}}" as="f" hint-placeholder-count="3"><button class="fchip" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
                </sc-if>
              </div>
            </div>
          </sc-if>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div class="comp">
    <form onSubmit="{{submit}}">
      <input maxlength="1000" disabled="{{inputDisabled}}" onKeyDown="{{inputKey}}" value="{{query}}" onChange="{{onChange}}" placeholder="{{ph}}" aria-label="디미에게 물어보기">
      <button class="send" disabled="{{sendDisabled}}" type="submit" aria-label="보내기"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
    </form>
  </div>

  <sc-if value="{{drawerOpen}}" hint-placeholder-val="{{ false }}">
    <div class="dim" onClick="{{closeDrawer}}"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="{{d.title}}">
      <span class="grab"></span><button class="close-sheet" onClick="{{closeDrawer}}" aria-label="닫기">×</button>
      <div style="padding:10px 20px 18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto">
        <div style="display:flex;gap:12px;align-items:center">
          <span class="orb {{d.orb}}" style="width:52px;height:52px"></span>
          <div style="min-width:0;flex:1">
            <span class="tag"><span class="{{d.dot}}"></span>{{d.typeLabel}}</span>
            <h1 style="font-size:19px;line-height:1.3;font-weight:700;letter-spacing:-0.03em;margin-top:2px">{{d.title}}</h1>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)">{{d.receivedLabel}}<sc-if value="{{d.taste}}" hint-placeholder-val="{{ false }}"><span class="tp">✦ 내 취향</span></sc-if></div>
        <p style="font-size:14px;line-height:1.65;color:var(--text-2)">{{d.summary}}</p>
        <div class="facts"><sc-for list="{{d.facts}}" as="f" hint-placeholder-count="3"><div class="fact"><span>{{f.k}}</span><b style="font-weight:500">{{f.v}}</b></div></sc-for></div>
      </div>
      <div style="display:flex;gap:8px;padding:12px 20px 30px;border-top:1px solid var(--border)">
        <button class="pbtn" onClick="{{d.openFull}}">{{d.primary}}</button>
        <sc-if value="{{d.hasOrigin}}"><a class="sbtn" href="{{d.origin}}" target="_blank" rel="noopener noreferrer">원본</a></sc-if>
      </div>
    </div>
  </sc-if>
</section></sc-scope></sc-if>
