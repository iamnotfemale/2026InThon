<sc-if value="{{isHome}}"><sc-scope value="{{homeChat}}">
<div class="home-chat"><div class="body">
    <section class="chatcol">
      <div class="scroll" ref="{{scrollRef}}">
        <div class="inner">
          <sc-if value="{{empty}}" hint-placeholder-val="{{ true }}">
            <section class="hero">
              <span class="glow"></span>
              <img src="/assets/home-chat-mascot.png" alt="디미">
              <h1>{{greeting}}</h1>
              <p>보냈던 콘텐츠를 말로 찾아보세요. 디미가 바로 골라 드릴게요.</p>
              <div class="sw">
              <form class="big" onSubmit="{{submit}}">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input value="{{query}}" onChange="{{onChange}}" onKeyDown="{{inputKey}}" maxlength="200" disabled="{{inputDisabled}}" placeholder="‘지난번 매콤한 레시피’, ‘마감 임박 공모전’처럼 물어보세요" aria-label="디미에게 물어보기">
                <button class="send" type="submit" disabled="{{sendDisabled}}" aria-label="보내기"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
              </form>
              <sc-if value="{{showSug}}" hint-placeholder-val="{{ false }}">
                <div class="sug" role="group" aria-label="바로 찾기">
                  <div class="lab"><span>{{sugLabel}}</span><span>{{sugCount}}</span></div>
                  <sc-for list="{{sug}}" as="it" hint-placeholder-count="3">
                    <button class="srow" onClick="{{it.open}}">
                      <span class="orb {{it.orb}}" style="width:34px;height:34px"></span>
                      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span class="tt">{{it.title}}</span><span class="mt"><span class="{{it.dot}}"></span>{{it.typeLabel}} · {{it.key}}</span></span>
                      <span style="font-size:12px;color:var(--muted)">{{it.when}}</span>
                    </button>
                  </sc-for>
                  <button class="askrow" onClick="{{askNow}}"><img src="/assets/home-chat-mascot.png" alt="" style="width:26px">디미에게 “{{query}}” 물어보기<span class="kbd">Enter</span></button>
                </div>
              </sc-if>
              </div>
              <div class="chips">
                <sc-for list="{{quick}}" as="q" hint-placeholder-count="5">
                  <button class="chip" onClick="{{q.pick}}"><span class="{{q.dot}}"></span>{{q.label}}</button>
                </sc-for>
              </div>
            </section>
            <section class="sec">
              <div class="sech"><b>최근 보낸 콘텐츠</b><span>총 {{total}}개</span></div>
              <sc-if value="{{recentNone}}"><p class="empty-note">{{recentNotice}}</p><sc-if value="{{showNoticeAction}}"><button type="button" class="sbtn" onClick="{{noticeAction}}">{{noticeActionLabel}}</button></sc-if></sc-if>
              <div class="grid">
                <sc-for list="{{recent}}" as="it" hint-placeholder-count="6">
                  <button class="card" onClick="{{it.open}}">
                    <span class="orb {{it.orb}}" style="width:40px;height:40px"></span>
                    <div style="min-width:0;flex:1"><div class="tt">{{it.title}}</div><div class="mt"><span class="{{it.dot}}"></span>{{it.typeLabel}} · {{it.when}}</div></div>
                  </button>
                </sc-for>
              </div>
            </section>
          </sc-if>
          <sc-if value="{{chatting}}" hint-placeholder-val="{{ false }}">
            <div class="thread" role="log" aria-label="콘텐츠 검색 대화" aria-live="polite">
              <sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
                <sc-if value="{{m.me}}" hint-placeholder-val="{{ true }}"><div class="me">{{m.text}}</div></sc-if>
                <sc-if value="{{m.bot}}" hint-placeholder-val="{{ false }}">
                  <div class="bot">
                    <span class="ava"><img src="/assets/home-chat-mascot.png" alt=""></span>
                    <div class="bd">
                      <span class="nm">디미</span>
                      <sc-if value="{{m.typing}}" hint-placeholder-val="{{ false }}"><span class="typing" aria-label="디미가 찾는 중"><i></i><i></i><i></i></span></sc-if>
                      <sc-if value="{{m.ready}}" hint-placeholder-val="{{ true }}">
                        <p class="msg">{{m.text}}</p>
                        <sc-if value="{{m.hasRes}}" hint-placeholder-val="{{ true }}">
                          <div class="res">
                            <sc-for list="{{m.results}}" as="it" hint-placeholder-count="2">
                              <button class="card" onClick="{{it.open}}">
                                <span class="orb {{it.orb}}" style="width:44px;height:44px"></span>
                                <div style="min-width:0;flex:1"><div class="tt">{{it.title}}</div><div class="mt"><span class="{{it.dot}}"></span>{{it.typeLabel}} · {{it.key}}</div></div>
                                <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
                              </button>
                            </sc-for>
                          </div>
                        </sc-if>
                        <div class="fchips">
                          <sc-for list="{{m.follow}}" as="f" hint-placeholder-count="3">
                            <button class="fchip" onClick="{{f.pick}}">{{f.label}}</button>
                          </sc-for>
                        </div>
                      </sc-if>
                    </div>
                  </div>
                </sc-if>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </div>
      <sc-if value="{{chatting}}" hint-placeholder-val="{{ false }}">
        <div class="composer">
          <form class="big" onSubmit="{{submit}}" style="max-width:860px">
            <input value="{{query}}" onChange="{{onChange}}" onKeyDown="{{inputKey}}" maxlength="200" disabled="{{inputDisabled}}" placeholder="디미에게 더 물어보기" aria-label="디미에게 물어보기">
            <button class="send" type="submit" disabled="{{sendDisabled}}" aria-label="보내기"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
          </form>
          <p class="hint">디미는 내가 보낸 콘텐츠 안에서만 찾아요.</p>
        </div>
      </sc-if>
    </section>
    <sc-if value="{{drawerOpen}}" hint-placeholder-val="{{ false }}">
      <aside class="drawer" aria-label="콘텐츠 상세">
        <div class="dhead">
          <span style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)"><span class="{{d.dot}}"></span>{{d.typeLabel}}</span>
          <button class="iconbtn" onClick="{{closeDrawer}}" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
        <div class="dbody">
          <div style="display:flex;gap:14px;align-items:center">
            <span class="orb {{d.orb}}" style="width:60px;height:60px"></span>
            <div style="min-width:0">
              <h2 style="font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-0.025em">{{d.title}}</h2>
              <div style="display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12.5px;color:var(--muted)">{{d.receivedLabel}}<sc-if value="{{d.taste}}" hint-placeholder-val="{{ false }}"><span class="tastepill">✦ 내 취향</span></sc-if></div>
            </div>
          </div>
          <p style="font-size:14px;line-height:1.65;color:var(--text-2)">{{d.summary}}</p>
          <div class="facts">
            <sc-for list="{{d.facts}}" as="f" hint-placeholder-count="3"><div class="fact"><span>{{f.k}}</span><b>{{f.v}}</b></div></sc-for>
          </div>
        </div>
        <div class="dact">
          <button type="button" class="pbtn" onClick="{{d.openFull}}">{{d.primary}}</button>
          <sc-if value="{{d.hasOrigin}}"><a class="sbtn" href="{{d.origin}}" target="_blank" rel="noopener noreferrer">원본 보기 ↗</a></sc-if>
        </div>
      </aside>
    </sc-if>
  </div>
</div>
</sc-scope></sc-if>
