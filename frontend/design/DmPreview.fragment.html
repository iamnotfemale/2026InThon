<div class="dm-preview" role="group" aria-label="DM 응답 예시" style="border: 1px solid var(--border); border-radius: 14px; overflow: hidden">
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2)">
                  <span class="label">응답 예시</span>
                  <div class="seg" role="group" aria-label="예시 유형" style="margin-left: auto; background: var(--surface)">
                    <sc-for list="{{dmTypes}}" as="t" hint-placeholder-count="4">
                      <button type="button" class="{{t.cls}}" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}"><span class="{{t.dot}}"></span>{{t.label}}</button>
                    </sc-for>
                  </div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border)">
                  <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: grid; place-content: center">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="var(--accent-fg)" stroke-width="2.6" stroke-linecap="round"><path d="M7 5v14M12 8v8M17 5v14"/></svg>
                  </span>
                  <span style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13px; font-weight: 500">dimi_in</span><span class="muted" style="font-size: 11.5px">Instagram DM · 예시</span></span>
                </div>
                <div style="padding: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--surface)">
                  <div class="bubble me" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px">
                    <span class="{{dmOrbCls}}" style="width: 32px; height: 32px"></span>
                    <span style="font-size: 12.5px">공유한 게시물 · {{dmSampleTitle}}</span>
                  </div>
                  <sc-for list="{{dmBubbles}}" as="b" hint-placeholder-count="2">
                    <div class="bubble bot">{{b.text}}</div>
                  </sc-for>
                  <sc-if value="{{dmPreviewLink}}"><div class="bubble bot" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); background: var(--surface)">
                    <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
                    <span style="display: flex; flex-direction: column; line-height: 1.35"><span style="font-size: 12.5px; font-weight: 500">서비스명 · 개인 결과</span><span class="muted mono" style="font-size: 11px">inthon.yeoziphab.com/items/••••</span></span>
                  </div>
</sc-if>
                </div>
              </div>
