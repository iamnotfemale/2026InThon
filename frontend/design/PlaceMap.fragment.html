  <!-- ============ 지도 (desktop and mobile) ============ -->
  <sc-if value="{{isMap}}" hint-placeholder-val="{{ false }}">
    <sc-scope value="{{placeMap}}">
      <div class="pmap-page">
        <div class="pmap-head">
          <div class="pmap-intro">
            <h1 class="pmap-h1">장소 지도</h1>
            <p class="muted">보낸 전시·팝업, 맛집, 취향공간을 한 지도에서 봐요. 핀 색으로 유형을 구분해요.</p>
          </div>
          <button type="button" class="{{tasteBtnCls}}" aria-pressed="{{tastePressed}}" onClick="{{toggleTaste}}">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
            <span>취향에 모은 것만</span>
          </button>
        </div>
        <div class="seg pmap-kinds" role="group" aria-label="장소 유형">
          <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
            <button type="button" class="{{k.cls}}" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}"><span class="{{k.dot}}"></span>{{k.label}}<span class="n">{{k.count}}</span></button>
          </sc-for>
        </div>

        <sc-if value="{{hasPlaces}}" hint-placeholder-val="{{ true }}">
          <div class="pmap-body">
            <div class="pmap-box">
              <div class="pmap" data-placemap="1"></div>
              <sc-if value="{{hasSelection}}" hint-placeholder-val="{{ false }}">
                <sc-scope value="{{selection}}">
                  <div class="pmap-card" role="group" aria-label="고른 장소">
                    <div class="pmap-card-head">
                      <span class="{{dot}}"></span><span class="muted">{{kindLabel}}</span>
                      <button type="button" class="pmap-card-close" aria-label="선택 닫기" onClick="{{close}}"></button>
                    </div>
                    <sc-for list="{{items}}" as="it" hint-placeholder-count="1">
                      <button type="button" class="pmap-card-item" onClick="{{it.open}}">
                        <span class="pmap-card-title">{{it.title}}</span>
                        <span class="pmap-card-go">자세히 보기</span>
                      </button>
                    </sc-for>
                    <span class="muted pmap-card-sub">{{sub}}</span>
                  </div>
                </sc-scope>
              </sc-if>
            </div>
            <div class="pmap-side">
              <p class="muted pmap-summary" aria-live="polite">{{summary}}</p>
              <ul class="pmap-list" aria-label="장소 목록">
                <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
                  <li>
                    <button type="button" class="{{r.cls}}" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}">
                      <span class="{{r.dot}}"></span>
                      <span class="pmap-row-text">
                        <span class="pmap-row-title">{{r.title}}</span>
                        <span class="pmap-row-sub">{{r.kindLabel}} · {{r.sub}}</span>
                        <sc-if value="{{r.hasNote}}" hint-placeholder-val="{{ false }}"><span class="{{r.noteCls}}">{{r.note}}</span></sc-if>
                      </span>
                    </button>
                  </li>
                </sc-for>
              </ul>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{noPlaces}}" hint-placeholder-val="{{ false }}">
          <div class="pmap-empty">
            <span class="orb o-unknown" style="width: 44px; height: 44px"></span>
            <span style="font-weight: 600">{{emptyTitle}}</span>
            <span class="muted" style="font-size: 13.5px">{{emptyDesc}}</span>
          </div>
        </sc-if>
      </div>
    </sc-scope>
  </sc-if>
