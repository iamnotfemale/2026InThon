<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입 채팅 온보딩</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.su{--bg:#FAFAFA;--surface:#FFFFFF;--surface-2:#F5F5F5;--border:#EAEAEA;--border-strong:#D4D4D4;--text:#0A0A0A;--text-2:#404040;--muted:#666666;font-family:'Geist','Noto Sans KR',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-0.005em;line-height:1.5}
.su *,.su *::before,.su *::after{box-sizing:border-box}
.su button,.su input{font:inherit;letter-spacing:inherit}
a{color:#0A0A0A}a:hover{color:#404040}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:500;color:var(--text);text-decoration:none;white-space:nowrap;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .12s ease,box-shadow .2s ease}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF}
.btn-primary:hover{background:#2A2A2A;border-color:#2A2A2A;color:#FFFFFF;box-shadow:0 0 0 4px rgba(10,10,10,.08),0 10px 24px -10px rgba(0,0,0,.45)}
.btn-primary:disabled:hover{background:#0A0A0A;box-shadow:none}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:rgba(10,10,10,.05);border-color:transparent}
.btn-lg{height:48px;padding:0 22px;font-size:15px}
.mesh{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6;animation:drift 18s ease-in-out infinite alternate}
.panel{position:relative;width:100%;max-width:600px;display:flex;flex-direction:column;border-radius:28px;background:rgba(255,255,255,.86);border:1px solid rgba(0,0,0,.06);box-shadow:0 40px 90px -40px rgba(60,40,100,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;animation:panelIn .6s cubic-bezier(.16,1,.3,1) both}
.msgs{height:440px;overflow-y:auto;padding:22px 22px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.row{display:flex;gap:10px;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{width:36px;height:36px;flex:none;border-radius:50%;background:#FFF4E6;border:1px solid #F5E3CC;display:grid;place-content:center;overflow:hidden}
.av img{width:34px;margin-top:4px}
.av.ghost{visibility:hidden}
.bub{max-width:78%;padding:11px 16px;border-radius:20px;font-size:15px;line-height:1.55;animation:pop .42s cubic-bezier(.34,1.4,.64,1) both;transform-origin:bottom left}
.bub.bot{background:#F2F0EC;color:var(--text);border-bottom-left-radius:6px}
.bub.me{background:#0A0A0A;color:#FFFFFF;border-bottom-right-radius:6px;transform-origin:bottom right}
.typing{display:inline-flex;gap:4px;align-items:center;padding:14px 16px;border-radius:20px;border-bottom-left-radius:6px;background:#F2F0EC;animation:pop .3s ease both}
.typing span{width:7px;height:7px;border-radius:50%;background:#9A9A9A;animation:bounce 1.1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.composer{padding:14px 16px 18px;border-top:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.9)}
.field{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px;border-radius:999px;border:1px solid var(--border);background:#FFFFFF;transition:border-color .15s ease,box-shadow .15s ease}
.field:focus-within{border-color:var(--border-strong);box-shadow:0 0 0 4px rgba(10,10,10,.06)}
.field input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;color:var(--text);height:38px}
.field input::placeholder{color:#9A9A9A}
.send{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:#0A0A0A;color:#FFFFFF;display:grid;place-content:center;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),opacity .2s ease}
.send:hover{transform:scale(1.06)}
.send:disabled{opacity:.25;cursor:not-allowed;transform:none}
.gbtn{width:100%;height:50px;border-radius:999px;border:1px solid var(--border-strong);background:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s ease,box-shadow .2s ease,transform .12s ease}
.gbtn:hover{background:#FAFAFA;box-shadow:0 6px 18px -10px rgba(0,0,0,.3)}
.gbtn:active{transform:scale(.98)}
.gbtn:disabled{cursor:progress;opacity:.7}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid #CFCFCF;border-top-color:#0A0A0A;animation:spin .8s linear infinite}
.steps{display:flex;gap:6px;align-items:center}
.steps span{height:5px;width:26px;border-radius:99px;background:#E7E3DC;transition:background .4s ease,width .4s cubic-bezier(.16,1,.3,1)}
.steps span.on{background:#0A0A0A;width:38px}
.steps span.done{background:#0A0A0A}
.done-card{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .5s cubic-bezier(.34,1.4,.64,1) both}
.bar{width:100%;height:4px;border-radius:99px;background:#EDEAE4;overflow:hidden}
.bar span{display:block;height:100%;width:100%;background:#0A0A0A;transform-origin:left;animation:fill 2.4s cubic-bezier(.4,0,.2,1) both}
.mascot{filter:drop-shadow(0 16px 22px rgba(120,80,30,.2));transform-origin:50% 90%}
.mascot.cheer{animation:cheer 1s cubic-bezier(.34,1.56,.64,1) both}
.mascot:hover{animation:squish .6s cubic-bezier(.34,1.56,.64,1)}
.err{font-size:12.5px;color:#B91C1C;padding:6px 18px 0}
:focus-visible{outline:2px solid #5E6AD2;outline-offset:3px;border-radius:12px}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,-30px) scale(1.12)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.08,.9)}60%{transform:scale(.96,1.05)}100%{transform:scale(1)}}
@keyframes cheer{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-6deg)}55%{transform:translateY(0) rotate(4deg) scale(1.04,.96)}75%{transform:translateY(-6px) rotate(-2deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.su *,.su *::before,.su *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</helmet>
<div class="su" style="position: relative; min-height: 1000px; overflow: hidden; background: #FAFAFA; display: flex; flex-direction: column">
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
    <span class="mesh" style="width: 620px; height: 520px; left: -140px; top: -80px; background: #FDBA74"></span>
    <span class="mesh" style="width: 560px; height: 480px; right: -100px; top: 120px; background: #C4B5FD; animation-delay: -6s"></span>
    <span class="mesh" style="width: 520px; height: 420px; left: 30%; bottom: -160px; background: #BAE6FD; animation-delay: -11s"></span>
  </div>

  <header style="position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; height: 68px; padding: 0 28px">
    <a href="Landing.dc.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none">
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: #0A0A0A; display: grid; place-content: center">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M7 5v14M12 8v8M17 5v14"></path></svg>
      </span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.03em; color: #0A0A0A">서비스명</span>
    </a>
    <span style="margin-left: auto; font-size: 13.5px; color: #666666">이미 계정이 있나요?</span>
    <a class="btn btn-ghost" href="Main.dc.html" style="height: 36px">로그인</a>
  </header>

  <main style="position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 20px 56px">
    <img class="{{mascotCls}}" src="./assets/643336e9e4b4897d48e1aefd9715f721.png" alt="" style="width: 150px; margin-bottom: -46px; position: relative; z-index: 3">

    <section class="panel" aria-label="회원가입 대화">
      <div style="display: flex; align-items: center; gap: 12px; padding: 54px 22px 16px; border-bottom: 1px solid rgba(0,0,0,.06)">
        <span style="display: flex; flex-direction: column; line-height: 1.3">
          <span style="font-size: 15px; font-weight: 600">서비스명 도우미</span>
          <span style="font-size: 12.5px; color: #8A8A8A; display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #16A34A"></span>회원가입을 도와드릴게요</span>
        </span>
        <div class="steps" style="margin-left: auto" aria-label="{{stepAria}}">
          <sc-for list="{{stepBars}}" as="sb" hint-placeholder-count="3"><span class="{{sb.cls}}"></span></sc-for>
        </div>
      </div>

      <div class="msgs" ref="{{listRef}}" role="log" aria-live="polite">
        <sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
          <div class="{{m.rowCls}}">
            <sc-if value="{{m.isBot}}" hint-placeholder-val="{{ true }}">
              <span class="{{m.avCls}}" aria-hidden="true"><img src="./assets/643336e9e4b4897d48e1aefd9715f721.png" alt=""></span>
            </sc-if>
            <span class="{{m.bubCls}}">{{m.text}}</span>
          </div>
        </sc-for>
        <sc-if value="{{typing}}" hint-placeholder-val="{{ false }}">
          <div class="row">
            <span class="av" aria-hidden="true"><img src="./assets/643336e9e4b4897d48e1aefd9715f721.png" alt=""></span>
            <span class="typing" aria-label="입력 중"><span></span><span></span><span></span></span>
          </div>
        </sc-if>
      </div>

      <div class="composer">
        <sc-if value="{{showGoogle}}" hint-placeholder-val="{{ true }}">
          <button type="button" class="gbtn" onClick="{{googleLogin}}" disabled="{{googleBusy}}">
            <sc-if value="{{googleIdle}}" hint-placeholder-val="{{ true }}">
              <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 1px solid #E5E5E5; display: grid; place-content: center; font-size: 12px; font-weight: 700; color: #404040">G</span>
              Google로 계속하기
            </sc-if>
            <sc-if value="{{googleBusy}}" hint-placeholder-val="{{ false }}">
              <span class="spin" aria-hidden="true"></span>
              로그인하는 중이에요
            </sc-if>
          </button>
          <p style="margin: 10px 0 0; font-size: 12px; color: #8A8A8A; text-align: center">서비스 로그인이에요. Instagram 계정 연결은 가입 후 따로 진행해요.</p>
        </sc-if>

        <sc-if value="{{showName}}" hint-placeholder-val="{{ false }}">
          <label for="su-name" style="display: block; font-size: 12px; font-weight: 500; color: #666666; padding: 0 4px 6px 18px">이름</label>
          <div class="field">
            <input id="su-name" type="text" autocomplete="nickname" placeholder="불러드릴 이름을 입력하세요" value="{{nameDraft}}" onChange="{{onName}}" onKeyDown="{{onNameKey}}" maxlength="20">
            <button type="button" class="send" aria-label="이름 보내기" onClick="{{submitName}}" disabled="{{nameDisabled}}">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
            </button>
          </div>
        </sc-if>

        <sc-if value="{{showAge}}" hint-placeholder-val="{{ false }}">
          <label for="su-age" style="display: block; font-size: 12px; font-weight: 500; color: #666666; padding: 0 4px 6px 18px">나이</label>
          <div style="display: flex; gap: 8px; align-items: center">
            <div class="field" style="flex: 1">
              <input id="su-age" type="number" inputmode="numeric" min="1" max="120" placeholder="숫자로 입력하세요" value="{{ageDraft}}" onChange="{{onAge}}" onKeyDown="{{onAgeKey}}">
              <span style="font-size: 14px; color: #8A8A8A; padding-right: 4px">살</span>
              <button type="button" class="send" aria-label="나이 보내기" onClick="{{submitAge}}" disabled="{{ageDisabled}}">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
              </button>
            </div>
            <button type="button" class="btn btn-ghost" onClick="{{skipAge}}" style="color: #666666">건너뛰기</button>
          </div>
          <sc-if value="{{ageError}}" hint-placeholder-val="{{ false }}"><p class="err">1부터 120 사이 숫자로 입력해 주세요.</p></sc-if>
        </sc-if>

        <sc-if value="{{showDone}}" hint-placeholder-val="{{ false }}">
          <div class="done-card">
            <div class="bar" aria-hidden="true"><span></span></div>
            <a class="btn btn-primary btn-lg" href="Main.dc.html" style="width: 100%">대시보드로 이동
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
            </a>
            <button type="button" class="btn btn-ghost" onClick="{{restart}}" style="height: 32px; font-size: 12.5px; color: #8A8A8A">처음부터 다시</button>
          </div>
        </sc-if>

        <sc-if value="{{waiting}}" hint-placeholder-val="{{ false }}">
          <div style="height: 50px; display: grid; place-content: center; font-size: 13px; color: #9A9A9A">잠시만요…</div>
        </sc-if>
      </div>
    </section>

    <p style="font-size: 12px; color: #8A8A8A; text-align: center">가입하면 <a href="Landing.dc.html" style="color: #666666">이용약관</a>과 <a href="Landing.dc.html" style="color: #666666">개인정보처리방침</a>을 확인한 것으로 봐요. · 로그인은 데모 시뮬레이션이에요</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { msgs: [], typing: false, step: 'intro', name: '', age: '', nameDraft: '', ageDraft: '', ageError: false, seq: 0, cheer: false };
    this._timers = [];
  }
  componentDidMount() { this.start(); }
  componentWillUnmount() { this._timers.forEach(t => clearTimeout(t)); }
  componentDidUpdate() { if (this._list) this._list.scrollTop = this._list.scrollHeight; }
  later(fn, ms) { const t = setTimeout(fn, ms); this._timers.push(t); }
  push(from, text) { this.setState(s => ({ msgs: s.msgs.concat([{ id: s.seq + 1, from, text }]), seq: s.seq + 1 })); }
  botSay(texts, next) {
    const run = (i) => {
      if (i >= texts.length) { this.setState(Object.assign({ typing: false }, next || {})); return; }
      this.setState({ typing: true });
      this.later(() => { this.setState({ typing: false }); this.push('bot', texts[i]); this.later(() => run(i + 1), 260); }, 750 + Math.min(texts[i].length * 12, 600));
    };
    this.setState({ step: 'wait' });
    run(0);
  }
  start() {
    this._timers.forEach(t => clearTimeout(t)); this._timers = [];
    this.setState({ msgs: [], typing: false, step: 'intro', name: '', age: '', nameDraft: '', ageDraft: '', ageError: false, cheer: false });
    this.later(() => this.botSay(['안녕하세요! 보낸 콘텐츠를 대신 정리해 드리는 서비스명이에요.', '가입은 세 단계면 끝나요. 먼저 Google 계정으로 로그인해 주세요.'], { step: 'google' }), 450);
  }
  googleLogin() {
    if (this.state.step !== 'google') return;
    this.setState({ step: 'googleBusy' });
    this.later(() => {
      this.push('me', 'Google 계정으로 로그인했어요 · jimin@example.com');
      this.botSay(['로그인 완료! 반가워요.', '뭐라고 불러드리면 될까요?'], { step: 'name' });
    }, 1100);
  }
  submitName() {
    const v = this.state.nameDraft.trim();
    if (!v || this.state.step !== 'name') return;
    this.setState({ name: v, nameDraft: '' });
    this.push('me', v);
    this.botSay([v + '님, 좋은 이름이에요!', '마지막으로 나이를 알려주세요.'], { step: 'age' });
  }
  submitAge() {
    const raw = String(this.state.ageDraft).trim(); const n = parseInt(raw, 10);
    if (this.state.step !== 'age') return;
    if (!raw || isNaN(n) || n < 1 || n > 120) { this.setState({ ageError: true }); return; }
    this.setState({ age: String(n), ageDraft: '', ageError: false });
    this.push('me', n + '살');
    this.finish();
  }
  skipAge() {
    if (this.state.step !== 'age') return;
    this.setState({ ageDraft: '', ageError: false });
    this.push('me', '나이는 건너뛸게요');
    this.finish();
  }
  finish() {
    const nm = this.state.name;
    this.botSay(['완료되었어요!', nm + '님의 공간을 준비했어요. 이제 Instagram에서 보던 게시물을 @inthon2team에 보내보세요. 대시보드로 안내할게요!'], { step: 'done', cheer: true });
  }
  renderVals() {
    const s = this.state;
    const order = ['google', 'name', 'age'];
    const idx = s.step === 'done' ? 3 : (s.step === 'googleBusy' ? 0 : order.indexOf(s.step));
    const cur = idx < 0 ? (s.name ? (s.age || s.step === 'wait' ? 2 : 1) : 0) : idx;
    const msgs = s.msgs.map((m, i) => {
      const next = s.msgs[i + 1];
      const lastOfBot = m.from === 'bot' && (!next || next.from !== 'bot') && !(s.typing && !next);
      return Object.assign({}, m, {
        isBot: m.from === 'bot', rowCls: 'row' + (m.from === 'me' ? ' me' : ''),
        bubCls: 'bub ' + (m.from === 'me' ? 'me' : 'bot'),
        avCls: 'av' + (lastOfBot ? '' : ' ghost')
      });
    });
    return {
      msgs, typing: s.typing,
      listRef: (el) => { this._list = el; },
      mascotCls: 'mascot' + (s.cheer ? ' cheer' : ''),
      stepBars: [0, 1, 2].map(i => ({ cls: i < cur ? 'done' : (i === cur ? 'on' : '') })),
      stepAria: '가입 단계 ' + Math.min(cur + 1, 3) + ' / 3',
      showGoogle: s.step === 'google' || s.step === 'googleBusy', googleIdle: s.step === 'google', googleBusy: s.step === 'googleBusy',
      googleLogin: () => this.googleLogin(),
      showName: s.step === 'name', nameDraft: s.nameDraft, onName: e => this.setState({ nameDraft: e.target.value }),
      onNameKey: e => { if (e.key === 'Enter' && !((e.nativeEvent || e).isComposing)) { e.preventDefault(); this.submitName(); } },
      submitName: () => this.submitName(), nameDisabled: !s.nameDraft.trim(),
      showAge: s.step === 'age', ageDraft: s.ageDraft, onAge: e => this.setState({ ageDraft: e.target.value, ageError: false }),
      onAgeKey: e => { if (e.key === 'Enter') { e.preventDefault(); this.submitAge(); } },
      submitAge: () => this.submitAge(), ageDisabled: !String(s.ageDraft).trim(), skipAge: () => this.skipAge(), ageError: s.ageError,
      showDone: s.step === 'done', restart: () => this.start(),
      waiting: s.step === 'wait' || s.step === 'intro'
    };
  }
}
</script>
</body>
</html>
