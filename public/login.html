<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>디미 · 로그인</title><link rel="icon" href="/assets/dimi-icon.svg"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/brand.css"><link rel="stylesheet" href="/css/link.css"><script type="module" src="/js/browser-login.js"></script></head>
<body><div class="app link-page"><main class="card link-card"><div class="link-brand"><img src="/assets/dimi-icon.svg" width="28" height="28" alt=""><b>디미</b></div><h1 class="h1 link-title">로그인하고 이어서 보세요</h1>
<p id="login-progress" role="status">로그인을 준비하고 있어요…</p>
<section id="browser-handoff" hidden><div class="link-stack"><p>Google 로그인은 Chrome이나 Safari에서 진행해 주세요.</p><p class="muted">로그인하면 원래 보던 페이지로 바로 이어져요.</p><a id="open-chrome" class="btn btn-primary" hidden>Chrome에서 계속하기</a><p id="browser-steps" class="muted">Instagram의 ⋯ 메뉴에서 ‘외부 브라우저로 열기’를 선택해 주세요.</p><button id="copy-login" type="button" class="btn">로그인 링크 복사</button><input id="login-url" class="input" aria-label="복사할 로그인 링크" readonly hidden><p id="copy-status" class="muted" role="status"></p></div></section>
<p id="login-error" class="link-error" role="alert" hidden></p><button id="retry-login" class="btn" type="button" hidden>다시 로그인하기</button></main></div></body></html>
